name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: npm install
      - run: pip install pypowerpetdoor
      - run: |
          ppd-simulator --port 3300 --daemon 3301 &
          sleep 3
          PPD_SIM_PORT=3300 npm test
